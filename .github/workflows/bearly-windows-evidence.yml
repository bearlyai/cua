name: Verify ordinary Windows background input
on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: 'Run native workspace tests as well as background proof'
        type: boolean
        default: false
      driver_source:
        description: 'Test a driver built from the checked-out commit, or a released asset'
        type: choice
        options: [build, release]
        default: build
      release_tag:
        description: 'Bearly driver release whose Windows x64 asset is tested (driver_source=release)'
        required: false
        default: 'cua-driver-rs-v0.34.1-bearly.1'
permissions:
  contents: read
  actions: read
jobs:
  native-unit:
    if: inputs.run_unit_tests
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CUA_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/cua-driver/rust -> target
          key: bearly-windows-evidence
          cache-on-failure: true
      - name: Test native Windows workspace
        working-directory: libs/cua-driver/rust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../../evidence | Out-Null
          cargo test --locked --workspace --lib --bins --no-fail-fast 2>&1 | Tee-Object ../../../evidence/native-tests.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-unit-results
          path: evidence
  background:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CUA_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        if: inputs.driver_source == 'build'
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        if: inputs.driver_source == 'build'
        with:
          workspaces: libs/cua-driver/rust -> target
          key: bearly-windows-evidence-build
          cache-on-failure: true
      - name: Build the driver from this commit
        if: inputs.driver_source == 'build'
        working-directory: libs/cua-driver/rust
        run: cargo build --locked --release -p cua-driver -p cua-driver-uia --target x86_64-pc-windows-msvc
      - name: Stage the built driver
        if: inputs.driver_source == 'build'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence/driver, evidence/background | Out-Null
          $built = 'libs/cua-driver/rust/target/x86_64-pc-windows-msvc/release'
          Copy-Item "$built/cua-driver.exe", "$built/cua-driver-uia.exe" evidence/driver/
          $driver = (Resolve-Path evidence/driver/cua-driver.exe).Path
          $uia = (Resolve-Path evidence/driver/cua-driver-uia.exe).Path
          @{ source = 'build'; commit = (git rev-parse HEAD).Trim(); ref = $env:GITHUB_REF_NAME
             build_command = 'cargo build --locked --release -p cua-driver -p cua-driver-uia --target x86_64-pc-windows-msvc'
             driver = $driver; driver_sha256 = (Get-FileHash $driver -Algorithm SHA256).Hash.ToLower()
             uia_helper_sha256 = (Get-FileHash $uia -Algorithm SHA256).Hash.ToLower()
             version = (& $driver --version | Out-String).Trim() } |
            ConvertTo-Json | Tee-Object evidence/background/driver.json
      - name: Download released Windows driver
        if: inputs.driver_source == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Force evidence/archive, evidence/background | Out-Null
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -D evidence/archive -p '*-windows-x86_64.zip' -p checksums.txt
          $zip = @(Get-ChildItem evidence/archive/*-windows-x86_64.zip)
          if ($zip.Count -ne 1) { throw 'Expected one Windows x64 asset' }
          $hash = (Get-FileHash $zip[0].FullName -Algorithm SHA256).Hash.ToLower()
          $listed = Select-String -Path evidence/archive/checksums.txt -SimpleMatch $zip[0].Name | ForEach-Object { ($_.Line -split '\s+')[0].ToLower() }
          if ($listed -ne $hash) { throw "Checksum mismatch for $($zip[0].Name): $hash vs $listed" }
          Expand-Archive $zip[0].FullName -DestinationPath evidence/driver
          $drivers = @(Get-ChildItem evidence/driver -Recurse -Filter cua-driver.exe)
          if ($drivers.Count -ne 1) { throw 'Expected one regular driver' }
          @{ source = 'release'; commit = (git rev-parse HEAD).Trim()
             tag = $env:TAG; asset = $zip[0].Name; asset_sha256 = $hash
             driver = $drivers[0].FullName; driver_sha256 = (Get-FileHash $drivers[0].FullName -Algorithm SHA256).Hash.ToLower()
             files = @(Get-ChildItem evidence/driver -Recurse -File | ForEach-Object { $_.Name }) } |
            ConvertTo-Json | Tee-Object evidence/background/driver.json
      - name: Check background routes at ordinary integrity
        shell: pwsh
        run: |
          $driver = (Get-ChildItem evidence/driver -Recurse -Filter cua-driver.exe).FullName
          $python = (Get-Command python).Source
          ./scripts/bearly/windows-medium.ps1 -Driver $driver -Python $python -Output evidence/background
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ordinary-integrity-evidence
          path: evidence/background
