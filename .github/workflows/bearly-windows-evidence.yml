name: Verify ordinary Windows background input
on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: 'Run native workspace tests as well as background proof'
        type: boolean
        default: true
      build_run:
        description: 'Exact Bearly driver build run supplying Windows x64 archive'
        required: true
        default: '43112319746'
permissions:
  contents: read
  actions: read
jobs:
  native-unit:
    if: inputs.run_unit_tests
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CUA_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/cua-driver/rust -> target
          key: bearly-windows-evidence
          cache-on-failure: true
      - name: Test native Windows workspace
        working-directory: libs/cua-driver/rust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../../evidence | Out-Null
          cargo test --locked --workspace --lib --bins --no-fail-fast 2>&1 | Tee-Object ../../../evidence/native-tests.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-unit-results
          path: evidence
  background:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CUA_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: evidence/archive
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Check background routes at ordinary integrity
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem evidence/archive/*.zip)
          if ($zips.Count -ne 1) { throw "Expected one Windows archive" }
          Expand-Archive $zips[0].FullName -DestinationPath evidence/driver
          $drivers = @(Get-ChildItem evidence/driver -Recurse -Filter cua-driver.exe)
          if ($drivers.Count -ne 1) { throw "Expected one regular driver" }
          $python = (Get-Command python).Source
          ./scripts/bearly/windows-medium.ps1 -Driver $drivers[0].FullName -Python $python -Output evidence/background
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ordinary-integrity-evidence
          path: evidence/background
